<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
var search = window.location.search;
var urlMatch = search.match(/[?&]url=(.+)/);
var targetUrl = urlMatch ? urlMatch[1] : null;

function isWeChat() {
  return /MicroMessenger/i.test(navigator.userAgent);
}

if (targetUrl && !isWeChat()) {
  window.location.replace(decodeURIComponent(targetUrl));
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线客服</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','微软雅黑',sans-serif;background:#f0f4ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.banner{width:100%;max-width:420px;background:linear-gradient(135deg,#1677ff,#4096ff);border-radius:16px 16px 0 0;padding:18px 20px;display:flex;align-items:center;gap:12px}
.banner-icon{width:40px;height:40px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.banner-text h2{color:#fff;font-size:16px;font-weight:700}
.banner-text p{color:rgba(255,255,255,0.8);font-size:12px;margin-top:2px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#52c41a;box-shadow:0 0 6px #52c41a;display:inline-block;margin-right:4px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.card{width:100%;max-width:420px;background:#fff;border-radius:0 0 16px 16px;padding:24px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.notice-box{background:#fff7e6;border:1px solid #ffd591;border-radius:10px;padding:12px 14px;margin-bottom:20px;font-size:13px;color:#d46b08;line-height:1.6}
.steps-wrap{margin-bottom:20px}
.steps-title{font-size:14px;font-weight:700;color:#1d1d1f;margin-bottom:14px}
.step-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.step-badge{width:24px;height:24px;border-radius:50%;background:#1677ff;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-desc{font-size:14px;color:#333;line-height:1.6}
.step-desc b{color:#1677ff}
.guide-box{background:#f8f9ff;border:1px solid #e0e8ff;border-radius:12px;padding:16px;margin-bottom:20px}
.guide-title{font-size:12px;color:#888;text-align:center;margin-bottom:12px}
.phone-mock{background:#1a1a2e;border-radius:16px;overflow:hidden;border:2px solid #333}
.phone-topbar{background:#222;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.phone-url{font-size:10px;color:#999;flex:1}
.phone-dots{display:flex;gap:3px;align-items:center}
.phone-dots span{width:4px;height:4px;border-radius:50%;background:#fff;display:block}
.arrow-wrap{position:relative;display:flex;justify-content:flex-end;margin-bottom:-6px}
.red-arrow{color:#ff3b30;font-size:28px;transform:rotate(-30deg);margin-right:8px}
.arrow-tip{position:absolute;right:30px;top:-28px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.arrow-tip::after{content:'';position:absolute;bottom:-5px;right:10px;border:5px solid transparent;border-top-color:#ff3b30}
.phone-content{background:#f5f5f5;padding:20px 16px;text-align:center}
.phone-content p{font-size:12px;color:#333;font-weight:700;margin-bottom:4px}
.phone-content span{font-size:11px;color:#666}
.menu-mock{background:#fff;border-radius:10px;margin:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.menu-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;color:#666}
.menu-row:last-child{border:none;color:#1677ff;font-weight:700;background:#f0f6ff}
.menu-row-icon{width:24px;height:24px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px}
.menu-row:last-child .menu-row-icon{background:#1677ff;color:#fff}
.highlight-tag{display:inline-block;background:#ff3b30;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;margin-left:6px}
.footer-tip{text-align:center;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="banner">
  <div class="banner-icon">💬</div>
  <div class="banner-text">
    <h2>在线客服咨询</h2>
    <p><span class="status-dot"></span>客服在线 · 随时为您服务</p>
  </div>
</div>
<div class="card">
  <div class="notice-box">⚠️ <b>微信内暂时无法直接访问</b>，请按以下步骤用浏览器打开，即可正常使用客服系统。</div>
  <div class="steps-wrap">
    <div class="steps-title">📋 操作步骤</div>
    <div class="step-row"><div class="step-badge">1</div><div class="step-desc">点击右上角 <b>「···」</b> 三个点按钮</div></div>
    <div class="step-row"><div class="step-badge">2</div><div class="step-desc">在菜单中选择 <b>「在浏览器打开」</b></div></div>
    <div class="step-row"><div class="step-badge">3</div><div class="step-desc">浏览器自动打开后即可开始咨询 🎉</div></div>
  </div>
  <div class="guide-box">
    <div class="guide-title">👇 操作示意图</div>
    <div class="arrow-wrap"><div class="arrow-tip">点这里</div><div class="red-arrow">↗</div></div>
    <div class="phone-mock">
      <div class="phone-topbar"><div class="phone-url">客服系统</div><div class="phone-dots"><span></span><span></span><span></span></div></div>
      <div class="phone-content"><p>请点击屏幕右上角[···]</p><span>用浏览器打开</span></div>
      <div class="menu-mock">
        <div class="menu-row"><div class="menu-row-icon">📤</div>分享给朋友</div>
        <div class="menu-row"><div class="menu-row-icon">🔗</div>复制链接</div>
        <div class="menu-row"><div class="menu-row-icon">🌐</div>在浏览器打开<span class="highlight-tag">点这个</span></div>
      </div>
    </div>
  </div>
  <div class="footer-tip">安全页面 · 数据加密保护</div>
</div>
</body>
</html>

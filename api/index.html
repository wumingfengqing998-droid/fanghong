<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服中转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC',sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:36px 28px;width:100%;max-width:380px;text-align:center}
.icon{width:68px;height:68px;margin:0 auto 16px;background:linear-gradient(135deg,#007aff,#00c6ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 32px rgba(0,122,255,0.4)}
.status{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:50%;background:#34d058;box-shadow:0 0 6px #34d058;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.status span{color:rgba(255,255,255,0.4);font-size:12px}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
.sub{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:28px;line-height:1.7}
.steps{background:rgba(0,122,255,0.08);border:1px solid rgba(0,122,255,0.2);border-radius:16px;padding:20px;margin-bottom:24px;text-align:left}
.steps-title{font-size:13px;color:#00c6ff;font-weight:700;margin-bottom:16px;text-align:center}
.step{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.step:last-child{margin-bottom:0}
.step-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#007aff,#00c6ff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px}
.step-text{font-size:14px;color:rgba(255,255,255,0.8);line-height:1.6}
.step-text b{color:#fff}
.arrow-guide{position:relative;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.15);border-radius:12px;padding:16px;margin-bottom:20px}
.phone-bar{display:flex;justify-content:flex-end;align-items:center;padding:8px 12px;background:rgba(255,255,255,0.06);border-radius:8px;margin-bottom:12px;position:relative}
.dots-icon{display:flex;flex-direction:column;gap:3px}
.dots-icon span{width:4px;height:4px;border-radius:50%;background:#fff;display:block}
.arrow-label{position:absolute;top:6px;right:44px;background:#ff3b30;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;white-space:nowrap}
.arrow-label::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-left-color:#ff3b30}
.menu-preview{background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;color:rgba(255,255,255,0.5)}
.menu-item:last-child{border-bottom:none;color:#fff;font-weight:700;background:rgba(0,122,255,0.2)}
.menu-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tip{font-size:12px;color:rgba(255,255,255,0.25);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="icon">💬</div>
  <div class="status"><div class="dot"></div><span>客服在线服务中</span></div>
  <h1>联系在线客服</h1>
  <div class="sub">请按以下步骤操作<br>即可打开客服咨询页面</div>
  <div class="steps">
    <div class="steps-title">📱 操作步骤</div>
    <div class="step"><div class="step-num">1</div><div class="step-text">点击右上角的 <b>「···」</b> 三个点按钮</div></div>
    <div class="step"><div class="step-num">2</div><div class="step-text">选择 <b>「在浏览器打开」</b></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-text">浏览器打开后即可<b>开始咨询</b> 🎉</div></div>
  </div>
  <div class="arrow-guide">
    <div class="phone-bar">
      <div class="arrow-label">点这里</div>
      <div class="dots-icon"><span></span><span></span><span></span></div>
    </div>
    <div class="menu-preview">
      <div class="menu-item"><div class="menu-icon">🔗</div>复制链接</div>
      <div class="menu-item"><div class="menu-icon">↗️</div>分享给朋友</div>
      <div class="menu-item"><div class="menu-icon">🌐</div>在浏览器打开 ✓</div>
    </div>
  </div>
  <div class="tip">安全页面 · 请放心操作</div>
</div>
</body>
</html>

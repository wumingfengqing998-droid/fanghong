.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:48px 32px;width:100%;max-width:380px;text-align:center}

.notice b{color:#00c6ff}
.btn{display:block;padding:16px;background:linear-gradient(135deg,#007aff,#00c6ff);border-radius:14px;color:#fff;font-size:16px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(0,122,255,0.4)}
